# Main configuration of the database image (05 8.2.2). The server is started with `-c config_file=` pointing here
# (see the CMD in the Dockerfile), so the installation's data directory carries no configuration of its own.
# Settings live in postgresql.conf.d/, one file per concern; this file only carries what the official image's
# generated file would carry and includes the directory.

listen_addresses = '*'

include_dir = 'postgresql.conf.d'
