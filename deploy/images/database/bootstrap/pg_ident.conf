# User name maps of the database (05 7.1.3; 09 10.8 item 1); the setup script writes this file over the data directory's
# pg_ident.conf at the first install, after replacing @FOUNDER@ (the founding user).
#
# Both maps take the container's own operating system user (postgres, the user the image runs as) and name the one database
# user each local socket line of pg_hba.conf lets it become.
#
# MAPNAME         SYSTEM-USERNAME   DATABASE-USERNAME
founder           postgres          @FOUNDER@
backup_status     postgres          shopfolio_backup_status
