# Development variant (05 8.1.2; 09 4.3 item 2): laid on top of compose.yaml,
#   docker compose --env-file deploy/release.env --env-file deploy/.env.example -f deploy/compose.yaml -f deploy/compose.dev.yaml up
# It adds the e-mail capture tool and the environment settings of the application that development needs (the made-up development
# connection string and the made-up values of the other required settings, below), and replaces the application's secrets list; no other image, no other database version, no secret of an installation. No e-mail leaves the
# machine: the application's development setting selects the gateway that writes to the capture tool's SMTP port (09 4.3
# item 2); that setting is added by the task that introduces it.
#
# Secret files: compose.yaml reads them from SHOPFOLIO_SECRETS_DIR. On a development machine point it at an untracked local
# directory that holds made-up values (the payment provider's test keys, made-up passwords) and made-up content for the e-mail
# sending credential: the real credential of an installation never reaches a development machine (05 8.1.2).
# The database connection of the application: this file carries its development value (09 4.3 item 2). The value is made up and
# is no secret of any installation: the whole connection string with a made-up password, which is also the made-up content of
# the db_setup_app_password file that the first start of the development database reads (below). The application therefore
# gets no db_app_connection file here (its secrets list is replaced); without the file the setting comes from the environment
# line below (05 6.x.1; 09 3.5 item 2, 4.3 item 2). The compose.yaml of an installation keeps the value in the secret file only.
# The very first start of an empty development database adds deploy/compose.install.yaml, as an installation does (05 6.x.6):
#   docker compose --env-file deploy/release.env --env-file deploy/.env.example -f deploy/compose.yaml -f deploy/compose.dev.yaml -f deploy/compose.install.yaml up -d database

services:
  app:
    environment:
      # Made-up development value; the password is the made-up content of the db_setup_app_password file of the development directory.
      # SHOPFOLIO_DEV_DATABASE (shell or env file) replaces the default when the local database differs; it is a development
      # convenience, not an installation setting, and is not in .env.example.
      Database__ConnectionString: ${SHOPFOLIO_DEV_DATABASE:-Host=database;Database=shopfolio;Username=shopfolio_app;Password=dev-only-made-up-password}
      # Made-up values of the other required settings that are not secrets (09 4.3 item 2, 3.5 item 2): none belongs to an installation.
      # The two required secret settings (Email:Credential, LinkKey:DerivationSecret) are NOT here: a secret is never a line of an
      # environment or a settings file (05 8.4.3). They come from the secret files email_credential and link_derivation_secret of the
      # development directory (SHOPFOLIO_SECRETS_DIR, above), which hold made-up content: any non-empty text for the e-mail credential
      # (the development gateway does not use it) and 32 random bytes in Base64 for the link secret.
      Site__Domain: localhost
      Email__SenderAddress: dev@example.com
      Email__Region: eu-central-1
    # Replaces (does not extend) the list of compose.yaml: the same list without db_app_connection.
    secrets:
      !override
      - payment_provider_keys
      - email_credential
      - google_client_secret
      - link_derivation_secret

  database:
    # The image's own command (deploy/images/database/Dockerfile CMD) plus the archive switched off: a development machine has no backup
    # repository, and the made-up one in .env.example would take an archive-push every minute that fails, so the log files would pile up in
    # pg_wal - and the scheduler's heartbeat (05 5.4.1) writes every thirty seconds. The restore drill and the backup jobs are not run in development.
    command:
      !override
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - archive_mode=off

  proxy:
    environment:
      # A local name: Caddy then serves it with its own local certificate authority instead of asking Let's Encrypt.
      SITE_DOMAIN: localhost

  mailpit:
    # Development tool, not shipped with the product (09 3.2 table). Full version tag and digest, never a floating tag.
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # The inbox web page, on this machine only. The SMTP port (1025) is reached by the application inside the network.
      - "127.0.0.1:8025:8025"
    networks:
      - edge
