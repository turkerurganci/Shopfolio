# pgBackRest configuration of the database image (05 7.6.1, 7.6.5, 7.6.6; 09 17). Installed as /etc/pgbackrest/pgbackrest.conf.
#
# Two repositories, always named explicitly by the jobs (a command without --repo uses repository 1, K-963):
#   repo1  the local copy in the server's own volume: the last full backup and the log files, for a hurried restore while the
#          server is up (05 7.6.1). It does not replace the off-server backup.
#   repo2  the object storage outside the server, encrypted before it leaves the container, prefix /database in the shared bucket
#          (05 7.6.4, 7.6.5). Its endpoint, bucket, region, access key and cipher key are NOT in this file: they arrive as
#          PGBACKREST_REPO2_* environment variables that database-entrypoint.sh builds from the installation settings and from
#          the two secret files (09 17 item 2).
#
# Retention is by TIME, never by count (05 7.6.6): full backups older than 30 days expire, and the newest full backup older than
# that limit is kept too, so the start of the 30 days stays restorable. pgBackRest applies it itself after each backup, which
# needs the object storage key's right to delete the current object (DEPLOY_RUNBOOK section J; D-01).

[global]
log-path=/var/log/postgresql/pgbackrest
spool-path=/var/spool/pgbackrest
log-level-console=warn
log-level-file=info
start-fast=y
compress-type=zst

repo1-type=posix
repo1-path=/var/lib/postgresql/local-backup
repo1-retention-full-type=time
repo1-retention-full=1

repo2-type=s3
repo2-path=/database
repo2-cipher-type=aes-256-cbc
repo2-retention-full-type=time
repo2-retention-full=30

[shopfolio]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
