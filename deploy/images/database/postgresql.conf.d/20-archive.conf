# Continuous log transfer (05 7.6.1, MK-25). Every write-ahead log file is handed to pgBackRest, which writes it to both
# repositories (the local copy and the object storage; deploy/images/database/pgbackrest.conf).
#
# archive_timeout closes an open log file after at most 50 seconds, and the archive command then moves it at once. Together they
# keep the transfer within one minute: the remaining ten seconds are the transfer of the closed file (05 7.6.1). Without the
# setting a file closes only when its 16 MB are full, and with little traffic the transfer would lag by hours.
#
# pgBackRest's queue limit (archive-push-queue-max) is deliberately NOT set: dropping log files at a limit would break
# point-in-time recovery, and zero loss prefers a stopped site to a lost log (05 7.6.9). A failing archive command therefore
# keeps the files on the local disk until the transfer works again; the status endpoint warns on it (05 9.4.4).
archive_mode = on
archive_timeout = 50s
archive_command = 'pgbackrest --stanza=shopfolio archive-push "%p"'
