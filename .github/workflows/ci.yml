name: CI

# Playbook CI iskeleti.
#   - Adim ISIMLERI, SIRASI ve KAPILAR sabittir.
#   - KOMUTLAR .github/ci-commands.env'de (SETUP.md §4).
#   - Bos komut: SETUP_COMPLETE=false iken uyari, true iken FAIL (ci-run.sh).
#   - Runtime: .NET SDK global.json'dan (setup-dotnet); PostgreSQL 18 hizmeti entegrasyon ve gocun adimlarinda (05 §2.3.6).

on:
  # pull_request'te base filtresi YOK -- bilerek. Filtre konursa base'i main
  # olmayan bir PR'da CI hic kosmaz; dal koruma rejimi de yalniz main'i
  # korudugu icin o PR yanlis yere CLEAN gorunur ve hata sessiz kalir.
  # Kuralin kendisi: INSTRUCTIONS §3.2 -- PR base'i her zaman main'dir.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Test kosucusunun (Microsoft.Testing.Platform) telemetrisi kapali: 09 §19.1 madde 6 "dis ag yoktur" (D-15).
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  # --------------------------------------------------------------------------
  # 0. Guard — direct push detection (server-side defence-in-depth)
  #
  # Yalniz push event'lerinde calisir. Squash merge commit mesajlari "(#NN)"
  # icerdiginden otomatik gecer. Direct push'lar (hook yoksa veya bypass
  # edildiyse) burada kirmizi yanar. Push zaten gerceklesmistir — amaci
  # ENGELLEMEK degil, GORUNUR IZ birakmaktir.
  # Acil bypass: commit mesajina [skip-guard].
  # --------------------------------------------------------------------------
  guard-direct-push:
    name: 0. Guard (direct push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Check for PR merge reference
        run: |
          MSG=$(git log -1 --format=%B HEAD)
          echo "Commit message: $MSG"
          if echo "$MSG" | grep -qE '\(#[0-9]+\)'; then
            echo "OK: commit mesajinda PR referansi var — squash merge."
          elif echo "$MSG" | grep -q '\[skip-guard\]'; then
            echo "::warning title=Guard Bypass::[skip-guard] override tespit edildi."
          else
            echo "::error title=Direct Push::Bu commit PR olmadan dogrudan push edildi."
            echo "Tum degisiklikler PR + CI uzerinden gitmelidir."
            echo "Bypass: commit mesajina [skip-guard] ekleyin (acil durum)."
            exit 1
          fi

  lint:
    name: 1. Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: bash .github/ci-run.sh LINT_CMD "1. Lint"

  build:
    name: 2. Build
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: bash .github/ci-run.sh BUILD_CMD "2. Build"

  unit-test:
    name: 3. Unit test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: bash .github/ci-run.sh UNIT_TEST_CMD "3. Unit test"

  integration-test:
    name: 4. Integration test
    needs: [build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # Yalniz bu isin atilabilir hizmet konteyneri; disaridan erisilmez.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SHOPFOLIO_TEST_DATABASE: Host=localhost;Port=5432;Username=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: bash .github/ci-run.sh INTEGRATION_TEST_CMD "4. Integration test"

  contract-test:
    name: 5. Contract test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/ci-run.sh CONTRACT_TEST_CMD "5. Contract test"

  migration-dry-run:
    name: 6. Migration dry-run
    needs: [build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # Geri alma sinamasi onceki surumun uygulama imajini kayit defterinden ceker (09 21.4 madde 3).
    permissions:
      contents: read
      packages: read
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      REGISTRY_CREDENTIAL: ${{ github.token }}
    steps:
      # Son yayimlanan surum etiketi icin tum gecmis ve etiketler gerekir.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: bash .github/ci-run.sh MIGRATION_DRYRUN_CMD "6. Migration dry-run"

  package-build:
    name: 7. Paketleme dogrulamasi
    needs: [build]
    runs-on: ubuntu-latest
    # Uygulama konteyneri bu hizmete baglanir ve canlilik ucu 200 verene kadar ayaga kaldirilir (05 8.3.10, 9.4.1).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SHOPFOLIO_TEST_DATABASE: Host=localhost;Port=5432;Username=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/ci-run.sh PACKAGE_BUILD_CMD "7. Paketleme"

  # --------------------------------------------------------------------------
  # 8. E2E — advisory.
  #
  # continue-on-error + ci-gate.needs DISINDA: flaky bir E2E run'i merge'u
  # bloklamaz. Buna karsilik E2E harness KODU "1. Lint" ve "2. Build"
  # adimlarinda bloke-edicidir — yani harness curuyemez, yalniz calistirma
  # advisory'dir. Bu bilincli bir tercihtir; degistirilecekse gerekcesi
  # gate raporuna yazilir.
  # --------------------------------------------------------------------------
  e2e:
    name: 8. E2E (advisory)
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/ci-run.sh E2E_CMD "8. E2E"

  # --------------------------------------------------------------------------
  # CI Gate — tek toplu kapi. Dal korumasi (varsa) bu job'u required isaretler.
  # --------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - guard-direct-push
      - lint
      - build
      - unit-test
      - integration-test
      - contract-test
      - migration-dry-run
      - package-build
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          RESULTS='${{ toJSON(needs) }}'
          echo "$RESULTS"
          # 'skipped' kabul edilir (guard yalniz push'ta calisir).
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error title=CI Gate::En az bir job basarisiz."
            exit 1
          fi
          echo "CI Gate: tum zorunlu job'lar gecti."
