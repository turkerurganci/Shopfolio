# The database's own log (05 9.1.4, 9.1.5, 9.2.2). It goes to a file in the database log volume, not to the container output: the
# container's own output keeps only the start and crash messages and carries no personal data (05 9.2.3). The server writes one file
# and neither rotates nor deletes it (log_rotation_age and log_rotation_size are 0): the operating system's rotation tool splits it by
# day and deletes what is older than P-45, the same way it does for the other files of the server's logs (DEPLOY_RUNBOOK section L).
logging_collector = on
log_destination = 'stderr'
# A directory of its own under the volume, created in the image with the group the backup tool reads (Dockerfile); pgBackRest's
# directory beside it keeps its own group. The server makes a missing directory with 0700, which the backup tool could not read.
log_directory = '/var/log/postgresql/server'
log_filename = 'postgresql.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 0
log_truncate_on_rotation = off

# No query parameter reaches the log, and an error line carries no detail: the DETAIL, HINT, QUERY and CONTEXT parts of a message are
# where the value of a key (the e-mail address of a violated uniqueness) is written (05 9.1.5).
log_error_verbosity = terse
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_statement = 'none'
