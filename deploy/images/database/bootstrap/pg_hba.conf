# Client authentication of the database (05 3.2.5, 7.1.3; 09 10.8 item 1). The setup script writes this file over the data
# directory's pg_hba.conf at the first install, after replacing @FOUNDER@ (the founding user) and @DATABASE@ (the database).
#
# The image's own file is replaced, not extended: it carries `trust` lines for every local and loopback connection, and a `trust`
# line that covers all users would let anyone who reaches the socket become the founding user without a password and would make the
# separate backup status user meaningless (K-1098 (4)). No line here uses `trust`.
#
# TYPE  DATABASE        USER                              ADDRESS  METHOD

# The founding user connects only from inside the container, through the local socket, as the container's own database user:
# pgBackRest and the scheduler (05 6.x.6; K-987). No component connects to it over the network.
local   all             @FOUNDER@                                  peer map=founder
host    all             @FOUNDER@                         all      reject

# The backup status user connects only through the local socket and only to the application database, as the same container user.
# It has no password.
local   @DATABASE@      shopfolio_backup_status                    peer map=backup_status

# The three users that connect over the network from the application's own network (the database is on no other network),
# each to the application database only, with a password.
host    @DATABASE@      shopfolio_migrator,shopfolio_app,shopfolio_reader  all  scram-sha-256

# Everything else (other users, other databases, replication) matches no line and is refused.
