# Compose definition of one installation (05 3.2, 8.2.4, MK-10, MK-14): four services and the one-off migration service.
#
#   proxy     reverse proxy (Caddy 2)             the only service that publishes ports: 80 and 443 (05 8.9.3)
#   app       application                         reaches the proxy on `edge` and the database on `app-data`
#   database  PostgreSQL 18 and pgBackRest        reachable only on `app-data`; leaves only through `db-egress`
#   backup    file backup tool (restic)           never connects to the database; leaves only through `backup-egress`
#   migrate   migration bundle, one-off           runs at first install and at each update, then exits (05 3.2.6, 8.7)
#   command, read-command   management commands, one-off, profile `tools`   started on request only (05 3.2.6, 8.5.1, 6.x.18, 6.x.19)
#
# Run it with the release's image references and the installation settings as env files (09 4.3):
#   docker compose --env-file deploy/release.env --env-file /etc/shopfolio/settings.env -f deploy/compose.yaml up -d
# Development adds a second file (deploy/compose.dev.yaml) on top of this one.
#
# Values of the installation live outside this file: the plain settings file and the per-component secret files on the server
# (05 6.x.1, 8.4.3). Secrets reach a container only as files under /run/secrets; none is an environment variable of
# a long-running service (the one-off migration process gets its password in its own process environment, see `migrate`).
# The network section below is the single place where the trusted proxy network of the application is defined (09 15.1 item 8).

name: shopfolio

# The container runtime's log of a container's own output (05 9.1.1, 9.2.3): start and crash messages only, a small rotation of its own
# (three files of ten megabytes). The logs of the application, the proxy, the database and the backup tool go to files in their volumes
# (05 9.1.4); this output carries no personal data. Every service takes this block.
x-container-log: &container-log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    # Official Caddy 2 image, pinned by tag and digest (05 8.2.3). Renewed in the monthly maintenance release (05 8.8.2).
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    logging: *container-log
    security_opt:
      - no-new-privileges:true
    environment:
      SITE_DOMAIN: ${SHOPFOLIO_DOMAIN:?SHOPFOLIO_DOMAIN is required (the installation's domain name)}
    ports:
      # The only published ports of the installation (05 8.9.3; MK-76). TCP only: HTTP/3 is switched off in the Caddyfile.
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      # Only the images volume of the file area, read-only (05 7.7.1, 8.2.4). The digital product files are never visible here.
      - files-images:/srv/gorsel:ro
      - access-logs:/var/log/caddy
    tmpfs:
      - /config
    networks:
      - edge
    depends_on:
      - app

  app:
    image: ${SHOPFOLIO_APP_IMAGE:?SHOPFOLIO_APP_IMAGE is required (deploy/release.env)}
    restart: unless-stopped
    logging: *container-log
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ${SHOPFOLIO_SETTINGS_FILE:-/etc/shopfolio/settings.env}
        required: false
    environment:
      # The application's domain setting (Site:Domain; 09 3.5 item 2) is the same single value the reverse proxy reads (D-32 (a)).
      Site__Domain: ${SHOPFOLIO_DOMAIN:?SHOPFOLIO_DOMAIN is required (the installation's domain name)}
    # No environment line for the database connection: the whole connection string (host, database, user and password) is the
    # content of the secret file db_app_connection, and the application reads the setting Database:ConnectionString from it
    # (05 6.x.1; 09 3.5 item 2).
    secrets:
      - db_app_connection
      - payment_provider_keys
      - email_credential
      - google_client_secret
      - link_derivation_secret
    volumes:
      - files-images:/var/lib/shopfolio/images
      - files-digital:/var/lib/shopfolio/digital
      - access-logs:/var/log/shopfolio/access
      - app-logs:/var/log/shopfolio/app
      # The backup tool writes this; the application only reads it (05 3.2.4, 9.4.10).
      - backup-status:/var/lib/shopfolio/backup-status:ro
    healthcheck:
      # The image has a shell but no curl: bash opens the TCP connection itself and asks the liveness endpoint (09 17; T01).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /sistem/canlilik HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - edge
      - app-data
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  database:
    image: ${SHOPFOLIO_DATABASE_IMAGE:?SHOPFOLIO_DATABASE_IMAGE is required (deploy/release.env)}
    restart: unless-stopped
    logging: *container-log
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=shopfolio
      # Backup settings (DEPLOY_RUNBOOK section J): where the object storage is and when the nightly full backup runs. The run
      # time and the zone have defaults here so that a settings file without them still gives a backup that ends before the
      # 03:00 destruction job (05 5.3.2); the endpoint, bucket and region have none: the installation names its own storage.
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT is required (the object storage's host name)}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required (the bucket both backups share)}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:?BACKUP_S3_REGION is required (the object storage's region)}
      - BACKUP_S3_URI_STYLE=${BACKUP_S3_URI_STYLE:-host}
      - BACKUP_RUN_TIME=${BACKUP_RUN_TIME:-01:30}
      - BACKUP_TIME_ZONE=${BACKUP_TIME_ZONE:-Europe/Istanbul}
    # Only the backup keys are mounted for good. The superuser password and the setup copies of the three users' passwords reach
    # the database only at the first install, through deploy/compose.install.yaml (05 6.x.6): the setup script reads them while it
    # creates the users, and later starts of this service do not carry them.
    secrets:
      - db_backup_storage_key
      - db_backup_cipher_key
    volumes:
      # PostgreSQL 18 images keep the data directory below /var/lib/postgresql (a version directory), so the volume sits there.
      - db-data:/var/lib/postgresql
      - db-logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - app-data
      - db-egress

  backup:
    image: ${SHOPFOLIO_BACKUP_IMAGE:?SHOPFOLIO_BACKUP_IMAGE is required (deploy/release.env)}
    restart: unless-stopped
    logging: *container-log
    security_opt:
      - no-new-privileges:true
    # The scheduler is the image's entrypoint and needs a job: the nightly file backup (09 17 item 3; D-34 (a)). Without it the
    # entrypoint exits with a usage error and the restart policy loops.
    command: ["/usr/local/bin/file-backup-job.sh"]
    # Group 10002 owns pgBackRest's log directory in the database image (setgid, files 0640): the one extra right the backup
    # user needs to read the database's backup log. Nothing else of the database volume is readable through it (05 7.6.3).
    group_add:
      - "10002"
    environment:
      # The same settings as the database service's (DEPLOY_RUNBOOK section J); the run time is one setting for both jobs.
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT is required (the object storage's host name)}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required (the bucket both backups share)}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:?BACKUP_S3_REGION is required (the object storage's region)}
      - BACKUP_S3_URI_STYLE=${BACKUP_S3_URI_STYLE:-host}
      - BACKUP_RUN_TIME=${BACKUP_RUN_TIME:-01:30}
      - BACKUP_TIME_ZONE=${BACKUP_TIME_ZONE:-Europe/Istanbul}
    secrets:
      - file_backup_storage_key
      - file_backup_cipher_key
    volumes:
      # What the nightly file backup reads (05 3.2.4): file areas, logs, the operating system's journal. All read-only.
      - files-images:/data/images:ro
      - files-digital:/data/digital:ro
      - access-logs:/data/access-logs:ro
      - app-logs:/data/app-logs:ro
      - db-logs:/data/db-logs:ro
      - /var/log/journal:/data/os-journal:ro
      # What the backup tool writes: its own log directory and the status file the application reads.
      - backup-logs:/var/log/backup
      - backup-status:/var/lib/backup/status
    networks:
      - backup-egress
    # Created after the application and the database: a named volume takes its owner from the first container that mounts it
    # (the image's directory is copied into the empty volume), and the application's directories must be owned by the application.
    depends_on:
      - app

  migrate:
    # One-off: applies the migration bundle the application image carries, as the schema owner, then exits (05 3.2.6, 8.7.2).
    # The password comes from the secret file; it never enters the image or the Compose file. It is handed to the migration
    # process through PGPASSWORD (Npgsql reads it), not through the command line, where the host's process list would show it.
    # $$ keeps the shell substitution away from Compose's own interpolation.
    # The migration service connects with the maintenance session profile (09 10.7 item 2): the Options and Command Timeout keys carry the
    # profile's times in the same form DatabaseConnection.Configure writes them; a consistency test keeps the two equal.
    image: ${SHOPFOLIO_APP_IMAGE:?SHOPFOLIO_APP_IMAGE is required (deploy/release.env)}
    restart: "no"
    logging: *container-log
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -c
      - export PGPASSWORD="$$(cat /run/secrets/db_migrator_password)" && exec ./efbundle --connection "Host=database;Database=shopfolio;Username=shopfolio_migrator;Options=-c lock_timeout=5000 -c statement_timeout=600000 -c idle_in_transaction_session_timeout=30000;Command Timeout=605"
    secrets:
      - db_migrator_password
    networks:
      - app-data
    depends_on:
      database:
        condition: service_healthy

  # The two one-off command services below start only on request (`docker compose run --rm <service> ...`, profile `tools`), never
  # with `up`. They run the application image, so they get exactly the secrets of their row in 05 6.x.2 (05 6.x.18, 6.x.19).
  command:
    # Commands that write data and the status command (05 8.5.1, 6.x.19): the application user's password, nothing else. The
    # application's outside-service secrets and the derivation secret are not mounted: commands send no notification and run
    # no job queue.
    image: ${SHOPFOLIO_APP_IMAGE:?SHOPFOLIO_APP_IMAGE is required (deploy/release.env)}
    profiles: ["tools"]
    restart: "no"
    logging: *container-log
    security_opt:
      - no-new-privileges:true
    secrets:
      - db_app_connection
    volumes:
      # The command writes its own line to its own file in the application's log directory (09 13.2 item 5, 18.1 item 2).
      - app-logs:/var/log/shopfolio/app
    networks:
      - app-data
    depends_on:
      database:
        condition: service_healthy

  read-command:
    # Read command, return check and maintenance inspection (05 8.5.1, 6.x.18): the read-only user's password, nothing else.
    # The continuously running application never receives it.
    image: ${SHOPFOLIO_APP_IMAGE:?SHOPFOLIO_APP_IMAGE is required (deploy/release.env)}
    profiles: ["tools"]
    restart: "no"
    logging: *container-log
    security_opt:
      - no-new-privileges:true
    secrets:
      - db_reader_connection
    volumes:
      # read-logs (T387; 05 8.5.5, 9.3): the application's logs (its own line goes there too, 09 13.2 item 5), the proxy's access log
      # read only, and the result's directory: a server directory outside the logs and every backup (05 9.3.3); the encrypted
      # delivery and the deletion of the file are DEPLOY_RUNBOOK steps.
      - app-logs:/var/log/shopfolio/app
      - access-logs:/var/log/shopfolio/access:ro
      - ${SHOPFOLIO_EXPORT_DIR:-/var/tmp/shopfolio-export}:/tmp/shopfolio-export
    networks:
      - app-data
    depends_on:
      database:
        condition: service_healthy

networks:
  # Proxy and application. Not internal: the proxy publishes the ports and obtains the certificate, and the application reaches
  # the payment provider, the e-mail service and Google over encrypted connections (05 3.2.1). The subnets are fixed: the two of them
  # are the proxy's trust networks in the application (ReverseProxyTrust.TrustedNetworks, 09 15.1 item 8); a test keeps the two equal
  # (ReverseProxyTrustConsistencyTests, T215), so a subnet is changed here and in ReverseProxyTrust together.
  # IPv6 is on so that the proxy sees an IPv6 visitor's own address (05 6.3.3; checked at installation with
  # deploy/firewall/installation-checks.sh client-address).
  edge:
    name: shopfolio-edge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
        - subnet: fd7a:5f0c:9e11:1::/64

  # Application, database, migration. Internal: no route out of it at all, so neither the application nor the database can
  # leave through this network. The proxy and the backup tool are not on it, so they cannot reach the database (05 3.2.5).
  app-data:
    name: shopfolio-app-data
    internal: true
    ipam:
      config:
        - subnet: 172.30.4.0/24

  # The database's way out, used only for the encrypted connection to the object storage. Compose cannot filter by destination:
  # the network is either closed or open to every address. The destination is limited in the server's firewall, in the
  # DOCKER-USER chain, by the rule that deploy/firewall/docker-user-egress.sh installs for this subnet (05 3.2.5).
  db-egress:
    name: shopfolio-db-egress
    ipam:
      config:
        - subnet: 172.30.2.0/24

  # The backup tool's only network; same limit, same chain, its own subnet.
  backup-egress:
    name: shopfolio-backup-egress
    ipam:
      config:
        - subnet: 172.30.3.0/24

volumes:
  # Named volumes: data survives a container being replaced (05 8.2.4). The file area is two volumes; only the images one is
  # ever mounted into the proxy (05 7.7.1).
  db-data:
  db-logs:
  files-images:
  files-digital:
  access-logs:
  app-logs:
  caddy-data:
  backup-status:
  backup-logs:

secrets:
  # One file per secret, in a directory only root can open; each file belongs to the user of the container that reads it (05 6.x.1).
  # Distribution follows 05 6.x.2-6.x.7 and 6.x.19: no container is given a secret it does not use. The password of a database
  # user sits in two files with the same value, each read by one container user only: the connection string file of the
  # application image (db_app_connection, db_reader_connection) and, for the database's setup script at the first install, a
  # password file owned by the database user (db_setup_*_password; the migration password has db_migrator_password for
  # the migration service). A rotation writes both files of the user (DEPLOY_RUNBOOK section B.1).
  db_superuser_password:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_superuser_password
  db_migrator_password:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_migrator_password
  db_app_connection:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_app_connection
  db_reader_connection:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_reader_connection
  db_setup_migrator_password:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_setup_migrator_password
  db_setup_app_password:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_setup_app_password
  db_setup_reader_password:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_setup_reader_password
  db_backup_storage_key:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_backup_storage_key
  db_backup_cipher_key:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/db_backup_cipher_key
  file_backup_storage_key:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/file_backup_storage_key
  file_backup_cipher_key:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/file_backup_cipher_key
  payment_provider_keys:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/payment_provider_keys
  email_credential:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/email_credential
  google_client_secret:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/google_client_secret
  link_derivation_secret:
    file: ${SHOPFOLIO_SECRETS_DIR:-/etc/shopfolio/secrets}/link_derivation_secret
